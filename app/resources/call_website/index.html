<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call starten</title>
  <style>
   :root{ --radius:12px;--border:#e5e7eb;--bg:#fff;--muted:#64748b;--shadow:0 1px 2px rgba(0,0,0,.05) } body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a} .container{max-width:1200px;margin:2rem auto;padding:0 1rem} h1{margin:0 0 1rem;font-size:1.5rem} .layout{display:grid;grid-template-columns:minmax(320px,520px) 1fr;gap:2rem;align-items:start} .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem} form{display:grid;gap:.75rem} label{font-weight:600} input, textarea, button{padding:.6rem .8rem;font-size:1rem;border-radius:8px} input, textarea{border:1px solid var(--border);width:100%;box-sizing:border-box} input:focus, textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)} textarea{min-height:160px;line-height:1.4;resize:vertical} button{border:0;background:#0ea5e9;color:#fff;cursor:pointer} button:hover{background:#0284c7} pre{margin-top:.75rem;background:#f6f8fa;padding:1rem;border-radius:8px;overflow:auto;max-height:320px} .side{width:320px;justify-self:end} .side h2{margin:0 0 .25rem;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .side .number{font-size:1.75rem;font-weight:700;letter-spacing:.02em} @media (max-width:900px){ .layout{grid-template-columns:1fr} .side{justify-self:stretch;width:auto} }
  </style>
</head>
<body>
  <div class="container">
    <h1>Outbound Call starten</h1>
    <div class="layout">
      <section class="card">
        <form id="f">
          <label for="phone">Telefonnummer (z. B. +49777888777)</label>
          <input id="phone" name="phone" type="tel" placeholder="+49777888777" required pattern="^\+[0-9]{6,15}$">
          <label for="task">Task (was soll der Bot tun?)</label>
          <textarea id="task" name="task" placeholder="Beschreibe die Aufgabe für den Bot." maxlength="2000" rows="6"></textarea>
          <label for="prosody_rate">Sprechgeschwindigkeit (0.75 – 1.25)</label>
          <input id="prosody_rate" name="prosody_rate" type="number" step="0.01" min="0.75" max="1.25" value="1.00" required lang="en" inputmode="decimal">
          <small>1.00 = normal, Werte unter 1.00 = langsamer, über 1.00 = schneller</small>
          <button id="btn" type="submit">Start</button>
        </form>
        <pre id="out"></pre>
      </section>
      <aside class="side card">
        <h2>Call-Center anrufen</h2>
        <div class="number">+3280029964</div>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
