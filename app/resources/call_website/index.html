<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Azure Call Center Agent</title>


    <!-- Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Lokales CSS -->
    <link rel="stylesheet" href="./style.css" />

  </head>

  <body>
    <div class="top-right"><h2>Inbound: +3280029964</h2></div>
    <h1>AI Call Center</h1>

    <div class="container">
      <!-- EINZIGE FORM über zwei Cards -->
      <form id="f" class="two-cards-form">
        <!-- LEFT SECTION -->
        <!--  <h2>Konfiguration</h2>-->
        <section class="card">
          <label for="phone">Telefonnummer</label>
          <input id="phone" name="phone" type="tel" placeholder="+49777888777" required pattern="^\+[0-9]{6,15}$" />
          <label for="voiceSelect">Stimme</label>
                  <select id="voiceSelect" name="voiceSelect" required>
                  <optgroup label="🇩🇪 Deutschland">
                    <option value="de-DE-FlorianMultilingualNeural" selected>Florian</option>
                    <option value="de-DE-KatjaNeural">Katja</option>
                    <option value="de-DE-ConradNeural">Conrad</option>
                    <option value="de-DE-SeraphinaMultilingualNeural">Seraphina</option>
                    <option value="de-DE-AmalaNeural">Amala</option>
                    <option value="de-DE-BerndNeural">Bernd</option>
                    <option value="de-DE-ChristophNeural">Christoph</option>
                    <option value="de-DE-ElkeNeural">Elke</option>
                    <option value="de-DE-KasperNeural">Kasper</option>
                    <option value="de-DE-KillianNeural">Killian</option>
                    <option value="de-DE-KlarissaNeural">Klarissa</option>
                    <option value="de-DE-KlausNeural">Klaus</option>
                    <option value="de-DE-LouisaNeural">Louisa</option>
                    <option value="de-DE-MajaNeural">Maja</option>
                    <option value="de-DE-RalfNeural">Ralf</option>
                    <option value="de-DE-TanjaNeural">Tanja</option>
                    <option value="de-DE-Florian:DragonHDLatestNeural">Florian HD</option>
                    <option value="de-DE-Seraphina:DragonHDLatestNeural">Seraphina HD</option>
                  </optgroup>
                  <optgroup label="🇦🇹 Österreich">
                    <option value="de-AT-IngridNeural">Ingrid</option>
                    <option value="de-AT-JonasNeural">Jonas</option>
                  </optgroup>
                  <optgroup label="🇨🇭 Schweiz">
                    <option value="de-CH-LeniNeural">Leni</option>
                    <option value="de-CH-JanNeural">Jan</option>
                  </optgroup>
                </select>
          <label for="prosody_rate">Sprechgeschwindigkeit</label>
          <input id="prosody_rate" name="prosody_rate" type="number" step="0.01" min="0.75" max="1.25" value="1.00" required />
          <small id="prosody-help">0.75–1.25 (1 = normal)</small>

          <button id="btn" type="submit">Start</button>
          <pre id="out" aria-live="polite" role="status"></pre>
        </section>

        <!-- MIDDLE SECTION -->
        <section class="card">
          <label for="task">Prompt</label>
          <textarea id="task" name="task" placeholder="Beschreibe die Aufgabe für den Bot." rows="10"></textarea>

        </section>
      </form>

      <!-- RIGHT SECTION bleibt außen -->

        <aside class="card">
        <h4>Neues Feld hinzufügen</h4>
          <div class="grid">
            <input id="new-claim-description" type="text" placeholder="Beschreibung (z. B. Vorname des Schuldners)">
            <input id="new-claim-name" type="text" placeholder="Technischer Name (z. B. vorname)">
            <select id="new-claim-type">
              <option value="text" selected>Text</option>
              <option value="phone_number">Telefonnummer</option>
              <option value="datetime">Datum/Zeit</option>
            </select>
            <button id="add-claim" type="button">Hinzufügen</button>
          </div>
            <button id="select-all" type="button">Alle auswählen</button>
            <button id="deselect-all" type="button">Alle abwählen</button>
            <button id="reset-claims" type="button">Standard wiederherstellen</button>
          <div id="claims-list" style="margin-top: 1rem;"></div>
      </aside>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
